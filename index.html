<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12202e">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>Lift Log</title>
<style>
:root{--bg:#e8ecef;--ink:#12202e;--mut:#5d6b78;--card:#fff;--line:#cfd6dc;--acc:#1f5fbf;--ok:#2e7d4f;--warn:#b4531a}
@media(prefers-color-scheme:dark){:root{--bg:#0e1620;--ink:#e6edf3;--mut:#8b9aa8;--card:#16222f;--line:#2a3a4a;--acc:#6aa5f5;--ok:#58b57e;--warn:#e8985a}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(150px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:22px;margin:4px 0 10px;font-weight:800;letter-spacing:-.3px}
h2{font-size:17px;margin:0;font-weight:700}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.meta{color:var(--mut);font-size:13px}
.tag{font-size:12px;font-weight:700;border-radius:5px;padding:2px 6px;border:1px solid}
.tag.f{color:var(--warn)}.tag.r{color:var(--acc)}
.hint{color:var(--ok);font-weight:700;font-size:13px}
.set{display:grid;grid-template-columns:24px 1fr 1fr 46px;gap:6px;align-items:center;margin-top:8px}
.set b{color:var(--mut);font-size:13px;text-align:center}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;font-variant-numeric:tabular-nums}
.set input{text-align:center;font-size:18px;font-weight:700}
.tick{height:44px;border-radius:8px;border:2px solid var(--line);background:none;color:var(--bg);font-size:22px;font-weight:800}
.tick.d{background:var(--ok);border-color:var(--ok)}
button.b{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:11px 14px;font:inherit;font-weight:700}
button.g{background:none;color:var(--acc);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit}
button.x{background:none;border:0;color:var(--warn);font:inherit}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:14px 4px;font:inherit;font-weight:600}
nav button.on{color:var(--acc);box-shadow:inset 0 3px var(--acc)}
#rest{position:fixed;left:12px;right:12px;bottom:calc(58px + env(safe-area-inset-bottom));max-width:536px;margin:auto;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;display:none;align-items:center;justify-content:space-between}
#rest span{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
#rest button{background:none;border:1px solid currentColor;color:inherit;border-radius:8px;padding:6px 10px;font:inherit;margin-left:6px}
.warnbox{background:var(--card);border:1px solid var(--warn);border-radius:10px;padding:10px;margin-bottom:10px;font-size:14px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
</style></head><body><main id="app"></main><div id="rest"><span id="rt">0:00</span><div><button onclick="rAdd(30)">+30s</button><button onclick="rStop()">Skip</button></div></div>
<nav id="nav"></nav>
<script>
// [name, sets, reps, effort] effort: f = to failure (machine/cable/safe), r = stop 1-2 reps short (heavy free weight)
const S={
six:[
['Mon','Chest + Triceps (heavy)',[['Bench press',3,'5-8','r'],['Incline dumbbell press',2,'8-10','r'],['Rope pushdown',2,'8-12','f']]],
['Tue','Back + Biceps (heavy)',[['Weighted pull-up or pulldown',3,'6-8','f'],['Barbell row',3,'6-8','r'],['Barbell curl',2,'8-10','f']]],
['Wed','Legs + Shoulders (heavy)',[['Squat',3,'5-8','r'],['Romanian deadlift',3,'6-8','r'],['Standing calf raise',3,'8-12','f'],['Overhead press',3,'6-8','r']]],
['Thu','Chest + Triceps (volume)',[['Incline dumbbell press',3,'10-12','r'],['Machine press or dips',2,'10-15','f'],['Cable fly',2,'12-15','f'],['Overhead cable extension',3,'10-15','f']]],
['Fri','Back + Biceps (volume)',[['Neutral-grip pulldown',3,'10-12','f'],['Seated cable row',3,'10-12','f'],['Face pull',2,'15-20','f'],['Incline dumbbell curl',3,'10-15','f']]],
['Sat','Legs + Shoulders (volume)',[['Leg press',3,'10-15','f'],['Leg curl',3,'10-15','f'],['Leg extension',2,'12-15','f'],['Lateral raise',4,'12-20','f'],['Seated calf raise',3,'12-15','f']]]],
three:[
['Mon','Chest + Triceps',[['Bench press',4,'6-8','r'],['Incline dumbbell press',3,'8-12','r'],['Cable fly',3,'12-15','f'],['Overhead cable extension',3,'10-15','f'],['Rope pushdown',3,'10-15','f']]],
['Wed','Back + Biceps',[['Pull-up or lat pulldown',4,'6-10','f'],['Barbell row',4,'6-10','r'],['Seated cable row',3,'10-12','f'],['Face pull',3,'15-20','f'],['Incline dumbbell curl',3,'10-12','f'],['Hammer curl',2,'10-15','f']]],
['Fri','Legs + Shoulders',[['Leg press',4,'6-10','f'],['Romanian deadlift',3,'8-10','r'],['Leg curl',3,'10-15','f'],['Leg extension',2,'10-12','f'],['Standing calf raise',3,'10-15','f'],['Overhead press',3,'6-10','r'],['Lateral raise',4,'12-20','f']]]]
};
const $=s=>document.querySelector(s),E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-');
const D0={plan:'six',restart:false,logs:{},body:[],height:'',lastExport:0};
let db;try{db=Object.assign({},D0,JSON.parse(localStorage.getItem('lift')||'{}'))}catch(e){db=Object.assign({},D0)}
function save(){try{localStorage.setItem('lift',JSON.stringify(db))}catch(e){alert('Could not save. Browser storage is blocked or full.')}}
const todayStr=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
function defIdx(){const g=new Date().getDay();return db.plan==='six'?(g?g-1:0):({1:0,3:1,5:2}[g]||0)}
let tab='today',date=todayStr(),idx=defIdx(),hist=null;
const top=r=>+String(r).split('-').pop();
const keyOf=()=>date+'|'+db.plan+idx;
function ens(key,id,n){const l=db.logs[key]=db.logs[key]||{ex:{}};const e=l.ex[id]=l.ex[id]||{sets:[],note:''};while(e.sets.length<n)e.sets.push({w:'',r:'',d:0});return e}
function lastOf(id,cur){const ks=Object.keys(db.logs).sort().reverse();for(const k of ks){if(k===cur||k.slice(0,10)>date)continue;const e=db.logs[k].ex[id];if(e&&e.sets.some(s=>s.d))return e.sets.filter(s=>s.d)}return null}
function render(){
 $('#nav').innerHTML=[['today','Today'],['history','History'],['body','Body'],['more','More']].map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('');
 $('#app').innerHTML=({today:vToday,history:vHist,body:vBody,more:vMore})[tab]();
}
function vToday(){
 const ss=S[db.plan],s=ss[idx],key=keyOf();
 let h='';
 if(db.logs&&Object.keys(db.logs).length&&Date.now()-db.lastExport>7*864e5)h+='<div class="warnbox">Back up your data: More → Export backup. Clearing browser data erases it.</div>';
 h+=`<div class="row sp"><h1>${E(s[1])}</h1><input type="date" value="${date}" style="width:150px" onchange="date=this.value;render()"></div>`;
 h+='<div class="chips">'+ss.map((x,i)=>`<button class="chip ${i===idx?'on':''}" onclick="idx=${i};render()">${x[0]}</button>`).join('')+'</div>';
 if(db.restart)h+='<div class="warnbox">Restart mode: 2 sets per exercise, stop 2+ reps short of failure. Switch it off in More from week 3.</div>';
 s[2].forEach(e=>{
  const id=slug(e[0]),n=db.restart?Math.min(e[1],2):e[1],L=ens(key,id,n),last=lastOf(id,key);
  const eff=db.restart?'<span class="tag r">2+ reps left</span>':e[3]==='f'?'<span class="tag f">To failure</span>':'<span class="tag r">1-2 reps left</span>';
  const up=last&&last.length>=n&&last.every(x=>+x.r>=top(e[2]))?'<div class="hint">Hit top of range last time: add the smallest weight increase</div>':'';
  h+=`<div class="card"><div class="row sp"><h2>${E(e[0])}</h2>${eff}</div><div class="meta">${n} × ${e[2]}${last?' · Last: '+last.map(x=>x.w+'×'+x.r).join(', '):''}</div>${up}`;
  L.sets.forEach((x,i)=>{const p=last&&last[Math.min(i,last.length-1)]||{};
   h+=`<div class="set"><b>${i+1}</b><input type="number" inputmode="decimal" step="0.5" placeholder="${p.w||'kg'}" value="${E(x.w)}" oninput="upd('${key}','${id}',${i},'w',this.value)"><input type="number" inputmode="numeric" placeholder="${p.r||'reps'}" value="${E(x.r)}" oninput="upd('${key}','${id}',${i},'r',this.value)"><button class="tick ${x.d?'d':''}" onclick="tk('${key}','${id}',${i},'${e[3]}')">✓</button></div>`});
  h+=`<div class="row" style="margin-top:8px"><input placeholder="Note" value="${E(L.note)}" oninput="db.logs['${key}'].ex['${id}'].note=this.value;save()"><button class="g" onclick="ens('${key}','${id}',${L.sets.length+1});save();render()">+ Set</button></div></div>`;
 });
 return h;
}
function upd(k,id,i,f,v){db.logs[k].ex[id].sets[i][f]=v;save()}
function tk(k,id,i,eff){const s=db.logs[k].ex[id].sets[i];s.d=s.d?0:1;save();render();if(s.d)rStart(eff==='f'&&!db.restart?90:150)}
function vol(l){let v=0,n=0,t=0;Object.values(l.ex).forEach(e=>e.sets.forEach(s=>{t++;if(s.d){n++;v+=(+s.w||0)*(+s.r||0)}}));return{v,n,t}}
function vHist(){
 const ks=Object.keys(db.logs).sort().reverse().filter(k=>vol(db.logs[k]).n);
 if(!ks.length)return'<h1>History</h1><div class="card meta">No sessions yet. Tick a set on the Today tab to start.</div>';
 return'<h1>History</h1>'+ks.map(k=>{const[d,p]=k.split('|'),pl=p.startsWith('six')?'six':'three',i=+p.slice(pl.length),s=S[pl][i];if(!s)return'';const v=vol(db.logs[k]);
 return`<div class="card" onclick="db.plan='${pl}';idx=${i};date='${d}';tab='today';save();render()"><div class="row sp"><h2>${E(s[1])}</h2><span class="meta">${d}</span></div><div class="meta">${v.n} sets done · volume ${Math.round(v.v).toLocaleString()} kg</div></div>`}).join('');
}
function vBody(){
 const h=+db.height,rows=db.body.slice().sort((a,b)=>b.d.localeCompare(a.d));
 return`<h1>Body</h1><div class="card"><div class="row"><input id="bw" type="number" inputmode="decimal" placeholder="Weight kg"><input id="bc" type="number" inputmode="decimal" placeholder="Waist cm (navel)"></div><div class="row" style="margin-top:8px"><button class="b" onclick="addBody()">Save today's entry</button></div></div>`+
 (rows.length?rows.map((r,i)=>`<div class="card row sp"><div><b>${r.d}</b><div class="meta">${r.w?r.w+' kg':''} ${r.c?'· waist '+r.c+' cm':''} ${h&&r.c?'· waist/height '+(r.c/h).toFixed(2):''}</div></div><button class="x" onclick="db.body.splice(db.body.indexOf(db.body.find(z=>z.d==='${r.d}'&&z.w==='${r.w}'&&z.c==='${r.c}')),1);save();render()">Delete</button></div>`).join(''):'<div class="card meta">Measure waist at the navel, same time of day, weekly. Waist is only a proxy for visceral fat.</div>');
}
function addBody(){const w=$('#bw').value,c=$('#bc').value;if(!w&&!c)return;db.body.push({d:todayStr(),w,c});save();render()}
function vMore(){return`<h1>More</h1><div class="card"><label>Plan</label><select onchange="db.plan=this.value;idx=defIdx();save();render()"><option value="six" ${db.plan==='six'?'selected':''}>6-day: double body part, each twice</option><option value="three" ${db.plan==='three'?'selected':''}>3-day: Mon / Wed / Fri</option></select>
<label><input type="checkbox" style="width:auto" ${db.restart?'checked':''} onchange="db.restart=this.checked;save();render()"> Restart mode (2 sets, no failure, weeks 1-2)</label>
<label>Height (cm, for waist/height ratio)</label><input type="number" value="${E(db.height)}" oninput="db.height=this.value;save()"></div>
<div class="card"><button class="b" onclick="exp()">Export backup</button> <button class="g" onclick="$('#imp').click()">Import backup</button><input id="imp" type="file" accept=".json" style="display:none" onchange="imp(this.files[0])"><div class="meta" style="margin-top:8px">Last export: ${db.lastExport?new Date(db.lastExport).toLocaleDateString():'never'}</div></div>
<div class="card"><button class="x" onclick="if(confirm('Delete ALL data on this device?')){localStorage.removeItem('lift');location.reload()}">Erase all data</button></div>`}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='lift-log-'+todayStr()+'.json';a.click();db.lastExport=Date.now();save();render()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.logs)throw 0;db=Object.assign({},D0,o);save();render();alert('Backup imported')}catch(e){alert('Not a valid backup file')}};r.readAsText(f)}
let rt=0,ri=null;
function rStart(s){rt=s;$('#rest').style.display='flex';clearInterval(ri);rTick();ri=setInterval(()=>{rt--;rTick();if(rt<=0){rStop();if(navigator.vibrate)navigator.vibrate([300,100,300])}},1000)}
function rTick(){$('#rt').textContent=Math.floor(rt/60)+':'+String(Math.max(rt,0)%60).padStart(2,'0')}
function rAdd(s){rt+=s;rTick()}
function rStop(){clearInterval(ri);$('#rest').style.display='none'}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
